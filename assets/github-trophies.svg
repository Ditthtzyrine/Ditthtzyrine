<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-label="GitHub achievements">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#07050b"/><stop offset=".55" stop-color="#12091e"/><stop offset="1" stop-color="#24103d"/></linearGradient></defs>
<rect width="1200" height="250" rx="18" fill="url(#g)" stroke="#3b1b5f"/>
<text x="38" y="40" fill="#c084fc" font-family="monospace" font-size="12" letter-spacing="2">ACHIEVEMENTS</text>
<text x="38" y="70" fill="#faf7ff" font-family="Arial" font-size="20" font-weight="700">Progress is built one contribution at a time.</text>
