  <g transform="translate(184)"><rect width="164" height="108" rx="14" fill="#0b0711" stroke="#3b1b5f"/><circle cx="82" cy="38" r="20" fill="#1b0d2c" stroke="#8b5cf6"/><text x="82" y="44" text-anchor="middle" fill="#c4b5fd" font-family="Arial" font-size="17" font-weight="700">◆</text><text x="82" y="78" text-anchor="middle" fill="#f5f3ff" font-family="Arial" font-size="12" font-weight="700">CONSISTENCY</text><text x="82" y="94" text-anchor="middle" fill="#71717a" font-family="Arial" font-size="10">commit • learn • repeat</text></g>
  <g transform="translate(368)"><rect width="164" height="108" rx="14" fill="#0b0711" stroke="#3b1b5f"/><circle cx="82" cy="38" r="20" fill="#1b0d2c" stroke="#7c3aed"/><text x="82" y="44" text-anchor="middle" fill="#c4b5fd" font-family="Arial" font-size="17" font-weight="700">↗</text><text x="82" y="78" text-anchor="middle" fill="#f5f3ff" font-family="Arial" font-size="12" font-weight="700">MOMENTUM</text><text x="82" y="94" text-anchor="middle" fill="#71717a" font-family="Arial" font-size="10">one project at a time</text></g>
  <g transform="translate(552)"><rect width="164" height="108" rx="14" fill="#0b0711" stroke="#3b1b5f"/><circle cx="82" cy="38" r="20" fill="#1b0d2c" stroke="#6d28d9"/><text x="82" y="44" text-anchor="middle" fill="#c4b5fd" font-family="Arial" font-size="17" font-weight="700">+</text><text x="82" y="78" text-anchor="middle" fill="#f5f3ff" font-family="Arial" font-size="12" font-weight="700">OPEN SOURCE</text><text x="82" y="94" text-anchor="middle" fill="#71717a" font-family="Arial" font-size="10">learn from others</text></g>
  <g transform="translate(736)"><rect width="164" height="108" rx="14" fill="#0b0711" stroke="#3b1b5f"/><circle cx="82" cy="38" r="20" fill="#1b0d2c" stroke="#a855f7"/><text x="82" y="44" text-anchor="middle" fill="#d8b4fe" font-family="Arial" font-size="17" font-weight="700">✓</text><text x="82" y="78" text-anchor="middle" fill="#f5f3ff" font-family="Arial" font-size="12" font-weight="700">SHIP IT</text><text x="82" y="94" text-anchor="middle" fill="#71717a" font-family="Arial" font-size="10">make it useful</text></g>
