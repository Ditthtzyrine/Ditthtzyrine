<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#08060c"/><stop offset=".5" stop-color="#130a20"/><stop offset="1" stop-color="#211035"/></linearGradient></defs>
