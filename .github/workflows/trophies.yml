name: Update GitHub Trophies

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch trophy SVG
        run: |
          curl -fL --retry 3 \
            "https://github-profile-trophy.vercel.app/?username=ditthtzyrine&theme=darkhub&no-frame=true&no-bg=true&margin-w=7&column=8" \
            -o assets/github-trophies.svg

      - name: Commit trophy update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies.svg
          git diff --cached --quiet || git commit -m "chore: update github trophies"
          git push
